<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Culine &mdash; Reset Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/login.css">
</head>
<body class="login-body">

  <div class="produce-bg" aria-hidden="true">
    <span class="blob blob-tomato"></span>
    <span class="blob blob-greens"></span>
    <span class="blob blob-squash"></span>
    <span class="blob blob-honey"></span>
    <span class="blob blob-greens2"></span>
  </div>

  <main class="fb-wrap">

    <div class="fb-left">
      <div class="fb-logo">
        <span class="brand-mark">CL</span>
        <span class="fb-brand-name">Culine</span>
      </div>
      <p class="fb-tagline">Fresh groceries from local farms and vendors — order in minutes, delivered to your door.</p>
    </div>

    <div class="fb-right">
      <div class="login-card">

        <form class="login-form" id="resetForm">
          <h2 style="text-align:center; font-family:var(--font-display); margin:0 0 0.5rem;">Set new password</h2>
          <p style="text-align:center; color:var(--ink-soft); margin:0 0 1.5rem;">Your password reset link is valid for 1 hour.</p>

          <label class="field">
            <span class="field-label">New password</span>
            <input type="password" id="newPassword" placeholder="••••••••" required minlength="6">
          </label>
          <label class="field">
            <span class="field-label">Confirm new password</span>
            <input type="password" id="confirmPassword" placeholder="••••••••" required>
          </label>
          <p class="field-error" id="resetError"></p>
          <button class="submit-btn" type="submit">Update password</button>
        </form>

        <p class="login-foot">
          <a href="login.html">Back to sign in</a>
        </p>

      </div>
    </div>

  </main>

<script type="module">
import { supabase, supabaseConfigured } from './script/supabase-client.js';

const form = document.getElementById('resetForm');
const error = document.getElementById('resetError');

function setMessage(message, ok = false) {
  error.textContent = message;
  error.classList.toggle('is-error', !ok);
  error.style.color = ok ? 'var(--green-deep)' : '';
}

function lockForm(message) {
  setMessage(message);
  form.querySelectorAll('input, button').forEach(control => { control.disabled = true; });
}

// Supabase redirects here with #access_token=...&type=recovery (or #error=... if the link is bad).
const hashParams = new URLSearchParams(window.location.hash.substring(1));

if (!supabaseConfigured) {
  lockForm('Supabase is not configured.');
} else if (hashParams.get('error_description')) {
  lockForm(hashParams.get('error_description') + ' Request a new reset link from the sign-in page.');
} else {
  // supabase-js reads the recovery token from the URL itself; getSession() resolves once that is done.
  const { data: { session } } = await supabase.auth.getSession();
  if (!session) lockForm('Invalid or expired reset link. Request a new one from the sign-in page.');
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const password = document.getElementById('newPassword').value;
  const confirm = document.getElementById('confirmPassword').value;
  const submitBtn = form.querySelector('button[type="submit"]');

  if (password !== confirm) {
    setMessage("Passwords don't match.");
    return;
  }

  if (password.length < 6) {
    setMessage('Password must be at least 6 characters.');
    return;
  }

  submitBtn.disabled = true;
  setMessage('Updating password...', true);

  const { error: updateError } = await supabase.auth.updateUser({ password });

  if (updateError) {
    setMessage(updateError.message);
    submitBtn.disabled = false;
    return;
  }

  setMessage('Password updated! Redirecting...', true);

  setTimeout(() => {
    window.location.href = 'login.html';
  }, 1500);
});
</script>
</body>
</html>
